# Secrets Store CSI mapping: GCP Secret Manager → synced K8s Secret "fixbridge-secrets".
# Requires the Secrets Store CSI driver + GCP provider installed on the cluster.
# Replace PROJECT_ID below with the production project.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fixbridge-secrets
  namespace: fixbridge
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/fixbridge-production-db-url/versions/latest"
        path: "DB_URL"
      - resourceName: "projects/PROJECT_ID/secrets/fixbridge-production-db-password/versions/latest"
        path: "DB_PASSWORD"
      - resourceName: "projects/PROJECT_ID/secrets/fixbridge-production-jwt-secret/versions/latest"
        path: "JWT_SECRET"
      - resourceName: "projects/PROJECT_ID/secrets/fixbridge-production-stripe-secret-key/versions/latest"
        path: "STRIPE_SECRET_KEY"
      - resourceName: "projects/PROJECT_ID/secrets/fixbridge-production-stripe-webhook-secret/versions/latest"
        path: "STRIPE_WEBHOOK_SECRET"
      - resourceName: "projects/PROJECT_ID/secrets/fixbridge-production-openai-api-key/versions/latest"
        path: "OPENAI_API_KEY"
      - resourceName: "projects/PROJECT_ID/secrets/fixbridge-production-claude-api-key/versions/latest"
        path: "CLAUDE_API_KEY"
  secretObjects:
    - secretName: fixbridge-secrets
      type: Opaque
      data:
        - { objectName: "DB_URL", key: DB_URL }
        - { objectName: "DB_PASSWORD", key: DB_PASSWORD }
        - { objectName: "JWT_SECRET", key: JWT_SECRET }
        - { objectName: "STRIPE_SECRET_KEY", key: STRIPE_SECRET_KEY }
        - { objectName: "STRIPE_WEBHOOK_SECRET", key: STRIPE_WEBHOOK_SECRET }
        - { objectName: "OPENAI_API_KEY", key: OPENAI_API_KEY }
        - { objectName: "CLAUDE_API_KEY", key: CLAUDE_API_KEY }
