apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fixbridge
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: fixbridge-backend
      containers:
        - name: backend
          image: fixbridge-backend # overlays pin the Artifact Registry image + tag
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fixbridge-config
            - secretRef:
                name: fixbridge-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # Mounting the CSI volume is what triggers the Secret Manager → K8s Secret sync.
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 15
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fixbridge-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fixbridge
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: fixbridge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
