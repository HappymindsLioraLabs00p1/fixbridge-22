# GKE ingress with Google-managed TLS. Same-origin routing: /api → backend, everything else → frontend,
# so the browser never needs a cross-origin API URL.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: fixbridge-cert
  namespace: fixbridge
spec:
  domains:
    - fixbridge.example.com # overlays set the real domain
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fixbridge
  namespace: fixbridge
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "fixbridge-cert"
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - host: fixbridge.example.com # overlays set the real domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
