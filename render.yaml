# Companion host for the parts Netlify cannot run: the Spring Boot API, PostgreSQL and Redis.
# Netlify serves the Next.js frontend; this Blueprint serves everything behind /api.
#
# Deploy: push this repo to GitHub → Render → New → Blueprint → pick the repo.
# Then set the values marked `sync: false` in the Render dashboard (they are secrets or depend on
# the final URLs). Any equivalent host works — Railway, Fly.io, Koyeb, or the GCP Terraform in
# infra/terraform. Nothing here is Render-specific except the file format.

# Kept declared but no longer wired to the service, which now points at an external Postgres via the
# dashboard-set DB_* variables. Deleting this block would ask Render to DESTROY the database, so it
# stays until you remove it deliberately from the dashboard once the new database is proven.
databases:
  - name: fixbridge-postgres
    databaseName: fixbridge
    user: fixbridge
    plan: free

services:
  # No Redis service on purpose. It is only a cache here — the app runs correctly without it (the
  # health check deliberately ignores it), and free Redis is not dependable across providers. Add one
  # later and set REDIS_HOST/REDIS_PORT if caching becomes worth it.

  - type: web
    name: fixbridge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    plan: free
    envVars:
      # --- Database -------------------------------------------------------------------------
      # Set in the dashboard, NOT wired to a Render database. These were previously bound with
      # `fromDatabase`, which made them blueprint-managed — so pointing the app at an external
      # Postgres (Neon, Supabase, Cloud SQL) was silently reverted on every sync.
      #
      # Spring assembles the JDBC URL from these parts (see application.yml). For a hosted database
      # DB_PARAMS must carry `?sslmode=require`; leave out libpq-only options such as
      # channel_binding, which the JDBC driver does not understand.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PARAMS
        sync: false

      # --- Security -------------------------------------------------------------------------
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated. MUST include your Netlify site URL, e.g. https://fixbridge.netlify.app
      - key: CORS_ORIGINS
        sync: false

      # --- Integrations ---------------------------------------------------------------------
      # true = deterministic stubs (no external keys needed — good for a client demo).
      # false = live OpenAI/Claude/Stripe/Twilio/Resend; then fill in the keys below.
      # Master switch. Each integration below can override it independently, so you can run the
      # AI for real while payments/notifications stay stubbed.
      - key: INTEGRATIONS_STUB_MODE
        value: "true"
      - key: AI_STUB_MODE            # false = call OpenRouter for real
        value: "true"
      - key: PAYMENTS_STUB_MODE      # keep true until Stripe keys are set
        value: "true"
      - key: NOTIFICATIONS_STUB_MODE # keep true until Twilio/Resend keys are set
        value: "true"
      - key: AI_REASONING            # true for an OpenRouter ":reasoning" model
        value: "false"
      # AI: openrouter (one key, many models) | openai | claude
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
