# Companion host for the parts Netlify cannot run: the Spring Boot API, PostgreSQL and Redis.
# Netlify serves the Next.js frontend; this Blueprint serves everything behind /api.
#
# Deploy: push this repo to GitHub → Render → New → Blueprint → pick the repo.
# Then set the values marked `sync: false` in the Render dashboard (they are secrets or depend on
# the final URLs). Any equivalent host works — Railway, Fly.io, Koyeb, or the GCP Terraform in
# infra/terraform. Nothing here is Render-specific except the file format.

# Kept declared but no longer wired to anything: the service points at Neon via the DB_* variables
# above. This database holds none of the application's data.
#
# Deleting this block would ask Render to DESTROY the database, so it stays until you remove it
# deliberately from the dashboard once Neon is proven in production. Left in place it costs nothing
# on the free plan and keeps a rollback available.
databases:
  - name: fixbridge-postgres
    databaseName: fixbridge
    user: fixbridge
    plan: free

services:
  # --- Python AI / image processing service ---------------------------------------------------
  # Independent of the Java service: separate build, separate deploy, separate scaling. Java is the
  # only caller; this service holds no database and never writes to FixBridge's tables.
  - type: web
    name: fixbridge-ai-service
    runtime: docker
    dockerfilePath: ./fixbridge-ai-service/Dockerfile
    dockerContext: ./fixbridge-ai-service
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      # Generated once by Render; the Java service reads the same value via fromService below, so
      # the two are never kept in sync by hand.
      - key: SERVICE_AUTH_TOKEN
        generateValue: true
      # Stubbed until a key is added — the pipeline is fully exercised and costs nothing.
      - key: STUB_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: VISION_MODEL
        value: gpt-4o-mini
      # Cost controls. A vision model bills by pixels, so these are the levers that matter.
      - key: MAX_DIMENSION
        value: "1600"
      - key: MAX_IMAGES_PER_ASSESSMENT
        value: "4"
      - key: LOG_LEVEL
        value: INFO
  # No Redis service on purpose. It is only a cache here — the app runs correctly without it (the
  # health check deliberately ignores it), and free Redis is not dependable across providers. Add one
  # later and set REDIS_HOST/REDIS_PORT if caching becomes worth it.

  - type: web
    name: fixbridge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    plan: free
    envVars:
      # --- Database: Neon ---------------------------------------------------------------------
      # Deliberately NOT wired to the Render `fixbridge-postgres` block below. These were once bound
      # with `fromDatabase`, which made them blueprint-managed — so pointing the app at an external
      # Postgres was silently reverted on every sync.
      #
      # Everything except the password is declared here rather than left to the dashboard, so a
      # redeploy cannot quietly land on a different database than the one holding the data. None of
      # it is secret on its own: without the password these four values open nothing.
      #
      # Spring assembles the JDBC URL from these parts (see application.yml). DB_PARAMS carries
      # `?sslmode=require` and nothing else — Neon's own connection string appends
      # `channel_binding=require`, which is a libpq option the JDBC driver does not understand and
      # which fails the service at startup.
      - key: DB_HOST
        value: ep-holy-waterfall-ax7qkz0z-pooler.c-4.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        value: neondb_owner
      - key: DB_PARAMS
        value: "?sslmode=require"
      # The one value that never enters the repository. Set it in the Render dashboard, and set the
      # ROTATED password — the original is in this repo's history at 33784d6 and must be treated as
      # compromised.
      - key: DB_PASSWORD
        sync: false

      # --- Python AI service ------------------------------------------------------------
      # Present but NOT activated: AI_PROVIDER is unchanged, so the existing client stays in use
      # until you deliberately set it to `python`.
      # AI_SERVICE_URL is manual because Render's host property doesn't yield a full https:// URL —
      # paste the deployed service URL rather than risk a silently wrong value.
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        fromService:
          name: fixbridge-ai-service
          type: web
          envVarKey: SERVICE_AUTH_TOKEN
      - key: AI_SERVICE_TIMEOUT
        value: "60"

      # --- Security -------------------------------------------------------------------------
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated. MUST include your Netlify site URL, e.g. https://fixbridge.netlify.app
      - key: CORS_ORIGINS
        sync: false

      # --- Integrations ---------------------------------------------------------------------
      # true = deterministic stubs (no external keys needed — good for a client demo).
      # false = live OpenAI/Claude/Stripe/Twilio/Resend; then fill in the keys below.
      # Master switch. Each integration below can override it independently, so you can run the
      # AI for real while payments/notifications stay stubbed.
      - key: INTEGRATIONS_STUB_MODE
        value: "true"
      - key: AI_STUB_MODE            # false = call OpenRouter for real
        value: "true"
      - key: PAYMENTS_STUB_MODE      # keep true until Stripe keys are set
        value: "true"
      - key: NOTIFICATIONS_STUB_MODE # keep true until Twilio/Resend keys are set
        value: "true"
      - key: AI_REASONING            # true for an OpenRouter ":reasoning" model
        value: "false"
      # AI: openrouter (one key, many models) | openai | claude
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
