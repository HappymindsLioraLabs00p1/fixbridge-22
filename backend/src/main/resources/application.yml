# FixBridge backend configuration.
# NOTHING sensitive or brand-specific is hard-coded here — everything reads from environment
# variables so staging and production stay separate and the platform can be rebranded in one place.

spring:
  application:
    name: fixbridge-backend
  datasource:
    # Prefer an explicit DB_URL. Otherwise build the JDBC URL from the host/port/name a managed
    # provider hands out separately (Render, Neon, Supabase, Cloud SQL…), so no manual assembly.
    # DB_PARAMS carries driver options — hosted Postgres generally REQUIRES TLS, e.g. Neon and
    # Supabase both need "?sslmode=require". Empty by default so local development stays plaintext.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fixbridge}${DB_PARAMS:}}
    username: ${DB_USER:fixbridge}
    password: ${DB_PASSWORD:fixbridge}
    hikari:
      # Concurrent sign-ins each need a connection. Too few and requests queue behind the pool;
      # too many and a small managed Postgres refuses connections outright. Hosted free tiers
      # typically cap around 20-25 total, so leave headroom for migrations and any other client.
      maximum-pool-size: ${DB_POOL_MAX:12}
      minimum-idle: ${DB_POOL_MIN:2}
      # Fail fast rather than letting callers hang when the pool is saturated.
      connection-timeout: 10000
      # Recycle below typical provider idle timeouts so we never hand out a dead connection.
      max-lifetime: 900000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: none              # schema is owned by Flyway; Hibernate never manages or validates DDL
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  error:
    include-message: never        # never leak raw errors/stack traces to clients
    include-stacktrace: never

springdoc:
  # The API schema describes every endpoint and payload, which is a free map for an attacker.
  # Off by default; switch on per-environment when you actually want to browse it.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # Redis is a cache here, never the source of truth. If it blips we degrade to uncached reads —
    # we must NOT report the whole service unhealthy, or the platform will restart-loop the API.
    redis:
      enabled: ${HEALTH_CHECK_REDIS:false}

# ---- FixBridge application config (all overridable via env) ----
fixbridge:
  # Branding lives in ONE place; the frontend has its own mirror in src/config/brand.ts
  brand:
    name: ${BRAND_NAME:FixBridge}
    support-email: ${BRAND_SUPPORT_EMAIL:support@example.com}
    domain: ${BRAND_DOMAIN:example.com}
    primary-color: ${BRAND_PRIMARY_COLOR:#1f6feb}
  security:
    jwt-secret: ${JWT_SECRET:change-me-dev-secret-change-me-dev-secret}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:14}
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  ai:
    # provider + model names are configuration, changeable without a rebuild
    provider: ${AI_PROVIDER:openai}            # openai | claude | openrouter
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-terra}
    claude:
      base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com/v1}
      api-key: ${CLAUDE_API_KEY:}
      model: ${CLAUDE_MODEL:claude-sonnet-5}
    openrouter:
      # One key, many models. Model names are namespaced, e.g. anthropic/claude-sonnet-4
      # or openai/gpt-4o-mini. Pick one that supports vision + structured outputs.
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    # OpenRouter attributes requests to your app via these (optional but recommended).
    app-url: ${AI_APP_URL:https://fixbridge.example.com}
    app-title: ${AI_APP_TITLE:FixBridge}
    # Ask the model to conform to our JSON schema. Disable only if a model rejects the parameter —
    # the response is parsed defensively either way.
    structured-outputs: ${AI_STRUCTURED_OUTPUTS:true}
    # Only meaningful for reasoning models (e.g. the :reasoning variants on OpenRouter).
    reasoning: ${AI_REASONING:false}
    # Each integration can be stubbed independently, so you can run the AI live while payments
    # stay stubbed. Each falls back to INTEGRATIONS_STUB_MODE, which is the master switch.
    stub-mode: ${AI_STUB_MODE:${INTEGRATIONS_STUB_MODE:true}}
  # The separate Python AI/image service. Used only when fixbridge.ai.provider=python; the OpenAI,
  # Claude and stub clients are unaffected.
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    auth-token: ${AI_SERVICE_TOKEN:}
    model: ${AI_SERVICE_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_SERVICE_TIMEOUT:60}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/customer?paid=1}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/customer?canceled=1}
    connect-return-url: ${STRIPE_CONNECT_RETURN_URL:http://localhost:3000/contractor?onboarded=1}
    connect-refresh-url: ${STRIPE_CONNECT_REFRESH_URL:http://localhost:3000/contractor?refresh=1}
    stub-mode: ${PAYMENTS_STUB_MODE:${INTEGRATIONS_STUB_MODE:true}}
  storage:
    bucket: ${GCS_BUCKET:fixbridge-dev}
    signed-url-ttl-minutes: ${SIGNED_URL_TTL:15}
    # In stub mode, uploads/downloads route to this backend's own local object store.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    stub-mode: ${STORAGE_STUB_MODE:${INTEGRATIONS_STUB_MODE:true}}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:notifications@example.com}
  notifications:
    stub-mode: ${NOTIFICATIONS_STUB_MODE:${INTEGRATIONS_STUB_MODE:true}}
  billing:
    # Plan code → Stripe recurring Price ID. Amounts live in Stripe (admin-editable), never here.
    plans:
      diy_plus: ${PRICE_DIY_PLUS:}
      homecare_plus: ${PRICE_HOMECARE_PLUS:}
      property_pro: ${PRICE_PROPERTY_PRO:}
      contractor_pro: ${PRICE_CONTRACTOR_PRO:}
